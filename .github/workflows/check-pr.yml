# .github/workflows/check-pr.yml

name: Check PR

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: ESLint
        run: pnpm run lint

      - name: Typescript
        run: pnpm run typescript

      - name: Test
        run: pnpm run test
