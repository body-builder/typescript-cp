# .github/workflows/check-pr.yml

name: Check PR

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: '8'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: npm run lint

      - name: Typescript
        run: npm run typescript

      - name: Test
        run: npm run test
